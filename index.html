<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory - Найди пару</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Memory - Найди пару</h1>

        <div class="controls">
            <div class="difficulty">
                <button data-size="4" class="difficulty-btn active">4×4</button>
                <button data-size="6" class="difficulty-btn">6×4</button>
                <button data-size="8" class="difficulty-btn">6×6</button>
            </div>
            <div class="actions">
                <button id="hintBtn" class="action-btn">💡 Подсказка</button>
                <button id="resetBtn" class="action-btn">🔄 Новая игра</button>
            </div>
            <div class="stats">
                <span>⏱️ <span id="timer">00:00</span></span>
                <span>👟 <span id="moves">0</span></span>
                <span>✅ <span id="pairsFound">0</span>/<span id="totalPairs">0</span></span>
            </div>
        </div>

        <div id="board" class="board"></div>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
